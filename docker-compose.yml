services:

  # ---------- INFRA ----------

  postgres-auth:
    image: postgres:14-alpine
    container_name: postgres-auth
    restart: always
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: doctornow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data

  postgres-profile:
    image: postgres:14-alpine
    container_name: postgres-profile
    restart: always
    environment:
      POSTGRES_DB: profile_db
      POSTGRES_USER: doctornow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-profile-data:/var/lib/postgresql/data

  postgres-appointments:
    image: postgres:14-alpine
    container_name: postgres-appointments
    restart: always
    environment:
      POSTGRES_DB: appointments_db
      POSTGRES_USER: doctornow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-appointments-data:/var/lib/postgresql/data

  postgres-payments:
    image: postgres:14-alpine
    container_name: postgres-payments
    restart: always
    environment:
      POSTGRES_DB: payments_db
      POSTGRES_USER: doctornow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-payments-data:/var/lib/postgresql/data

  postgres-audit:
    image: postgres:14-alpine
    container_name: postgres-audit
    restart: always
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: doctornow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-audit-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:6.0
    container_name: mongodb
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: doctornow
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme}
    volumes:
      - mongodb-data:/data/db

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme}
    volumes:
      - redis-data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

  # ---------- SERVICES ----------

  auth-service:
    build: ./services/auth-service
    container_name: auth-service
    restart: always
    env_file: ./services/auth-service/.env
    depends_on:
      - postgres-auth
      - redis
      - kafka

  profile-service:
    build: ./services/profile-service
    container_name: profile-service
    restart: always
    env_file: ./services/profile-service/.env
    depends_on:
      - postgres-profile

  appointment-service:
    build: ./services/appointment-service
    container_name: appointment-service
    restart: always
    env_file: ./services/appointment-service/.env
    depends_on:
      - postgres-appointments
      - kafka

  consultation-service:
    build: ./services/consultation-service
    container_name: consultation-service
    restart: always
    env_file: ./services/consultation-service/.env
    depends_on:
      - mongodb
      - kafka

  hospital-admin-service:
    build: ./services/hospital-admin-service
    container_name: hospital-admin-service
    restart: always
    env_file: ./services/hospital-admin-service/.env
    depends_on:
      - postgres-profile

  medical-records-service:
    build: ./services/medical-records-service
    container_name: medical-records-service
    restart: always
    env_file: ./services/medical-records-service/.env
    depends_on:
      - mongodb

  super-admin-service:
    build: ./services/super-admin-service
    container_name: super-admin-service
    restart: always
    env_file: ./services/super-admin-service/.env
    depends_on:
      - postgres-audit
      - redis

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    restart: always
    ports:
      - "3000:3000"
    env_file: ./api-gateway/.env
    depends_on:
      - auth-service
      - profile-service
      - appointment-service

# ---------- VOLUMES ----------

volumes:
  postgres-auth-data:
  postgres-profile-data:
  postgres-appointments-data:
  postgres-payments-data:
  postgres-audit-data:
  mongodb-data:
  redis-data:
  kafka-data: